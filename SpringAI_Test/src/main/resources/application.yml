server:
  port: 8080
spring:
  application:
    name: spring-ai

  # ===== ES 连接配置（spring 下，与 ai 平级） =====
  elasticsearch:
    uris: http://192.168.74.100:9200

  ai:
    model:
      chat: openai  #clint
      embedding: ollama


    # DeepSeek 兼容 OpenAI 协议，只用于 Chat
    # embedding 由 ollama 提供，已通过 spring.ai.model.embedding=ollama 切换
    openai:
      base-url: https://api.deepseek.com
      api-key: ${Deepseek_Key}
      chat:
        options:
          model: deepseek-v4-flash
    mcp:
      client:
        stdio:
          servers-configuration: classpath:mcp-servers/servers.json  # MCP Server 配置文件路径

    # ===== 本地 Ollama（Chat + Embedding） =====
    # 注意：Spring AI 1.0.0 中 Ollama embedding 不需要 enabled: true，
    # 只要引入了 spring-ai-starter-model-ollama 并配置 model 即可自动启用
    ollama:
      base-url: http://127.0.0.1:11434
      #这个是我本地ollama的LLM模型
      chat:
        options:
          model: qwen2.5:3b
          #这个是bge-m3的向量模型，就是将内容转化为向量，1024维的向量
      embedding:
        options:
          model: bge-m3

    # ===== 向量存储（ai 下，与 openai/ollama 平级） =====
    vectorstore:
      elasticsearch:
        index-name: library-assistant
        dimensions: 1024
        initialize-schema: true

logging:
  level:
    org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor: DEBUG